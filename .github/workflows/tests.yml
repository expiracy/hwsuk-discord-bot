name: Functional tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build runtime and test images
        run: |
          docker build --target production -t hwsuk-discord-bot:local .
          docker build --target test -t hwsuk-discord-bot:test .
          docker build -t hwsuk-mongo:local docker/mongo
      - name: Run the suite in a non-root read-only container
        run: docker run --rm --read-only --tmpfs /tmp:mode=1777 hwsuk-discord-bot:test python -W error::RuntimeWarning -m unittest discover -v
      - name: Test authenticated deployment, persistence, and portability
        run: python tests/docker_smoke.py

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -W error::RuntimeWarning -m coverage run -m unittest discover -v
      - run: python -m coverage report

  mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Start an isolated MongoDB replica set
        shell: bash
        run: |
          docker run -d --name hwsuk-test-mongo -p 127.0.0.1:27018:27018 mongo:7.0 --port 27018 --replSet rs01 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec hwsuk-test-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then
              break
            fi
            sleep 1
          done
          docker exec hwsuk-test-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"rs01",members:[{_id:0,host:"localhost:27018"}]})'
          for attempt in {1..30}; do
            if docker exec hwsuk-test-mongo mongosh --port 27018 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Exercise real MongoDB persistence and concurrency
        env:
          TEST_MONGODB_URI: 'mongodb://127.0.0.1:27018/?replicaSet=rs01'
        run: python -W error::RuntimeWarning -m unittest tests.test_database_integration -v
      - name: Remove the test database container
        if: always()
        run: docker rm -f hwsuk-test-mongo
